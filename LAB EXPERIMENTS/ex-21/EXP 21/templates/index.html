<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>To-Do</title>
<style>body{font-family:Arial;max-width:480px;margin:40px auto}li{margin:6px 0}a{color:#c00;margin-left:8px}</style></head>
<body><h1>To-Do List</h1>
<form action="/add" method="post"><input name="task" placeholder="New task" required><button>Add</button></form>
<ul>{% for t in tasks %}<li>{{ t }}<a href="/delete/{{ loop.index0 }}">delete</a></li>{% endfor %}</ul>
</body></html>
